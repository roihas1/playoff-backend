[supervisord]
nodaemon=true
logfile=/app/playoff-backend/logs/supervisord.log
pidfile=/tmp/supervisord.pid

[program:nestjs]
command=/app/playoff-backend/wait-for-fastapi.sh
directory=/app/playoff-backend
priority=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:fastapi]
command=/opt/venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000
directory=/app/statistics-api
priority=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
